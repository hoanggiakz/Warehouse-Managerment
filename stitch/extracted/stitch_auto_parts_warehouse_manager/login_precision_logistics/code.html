<!DOCTYPE html><html class="h-full bg-surface" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Precision Logistics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                    "on-secondary-fixed": "#0b1c30",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary": "#505f76",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#2d3133",
                    "surface-container": "#eceef0",
                    "secondary-container": "#d0e1fb",
                    "danger": "#E11D48",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "tertiary-fixed": "#dae2fd",
                    "outline-variant": "#c4c5d5",
                    "on-secondary-fixed-variant": "#38485d",
                    "surface-alt": "#F1F5F9",
                    "inverse-on-surface": "#eff1f3",
                    "outline": "#757684",
                    "on-secondary-container": "#54647a",
                    "success": "#059669",
                    "primary-fixed-dim": "#b8c4ff",
                    "background": "#f7f9fb",
                    "tertiary": "#2d3449",
                    "on-primary-container": "#a8b8ff",
                    "surface": "#f7f9fb",
                    "primary-container": "#1e40af",
                    "surface-container-high": "#e6e8ea",
                    "surface-dim": "#d8dadc",
                    "tertiary-fixed-dim": "#bec6e0",

                    "on-surface-variant": "#444653",
                    "tertiary-container": "#434b60",

                    "secondary-fixed-dim": "#b7c8e1",
                    "on-tertiary-container": "#b4bbd5",
                    "warning": "#D97706",
                    "on-tertiary-fixed-variant": "#3f465c",
                    "on-tertiary": "#ffffff",

                    "secondary-fixed": "#d3e4fe",
                    "surface-bright": "#f7f9fb",
                    "on-primary-fixed-variant": "#173bab"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit-6": "24px",
                    "base": "4px",
                    "unit-2": "8px",
                    "gutter": "16px",
                    "unit-1": "4px",

<body class="h-full bg-surface text-on-surface flex items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-container-lowest border border-border-subtle rounded-xl shadow-[0_4px_6px_-1px_rgb(0,0,0,0.1)] overflow-hidden">
<!-- Header Area -->
<div class="px-unit-6 py-unit-8 bg-surface-container-low border-b border-border-subtle flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center mb-4 text-on-primary">
<span class="material-symbols-outlined" data-icon="precision_manufacturing" style="font-variation-settings: 'FILL' 1; font-size: 24px;">precision_manufacturing</span>
</div>
<h1 class="font-page-title text-page-title text-primary">Precision Logistics</h1>
<p class="font-body-sm text-body-sm text-secondary mt-1">Warehouse Management System</p>
</div>
<!-- Form Area -->
<div class="p-unit-6">
<form action="#" class="space-y-unit-4" method="POST">
<!-- Email/Username -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-unit-2" for="username">Username or Email</label>
<div class="relative">
<input class="block w-full rounded-DEFAULT border-outline-variant py-2 pl-3 pr-10 text-on-surface font-body-base text-body-base focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm bg-surface-container-lowest" id="username" name="username" placeholder="admin@precisionlogistics.com" type="text">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]" data-icon="person">person</span>
</div>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-unit-2" for="password">Password</label>
<div class="relative">
<input class="block w-full rounded-DEFAULT border-error py-2 pl-3 pr-10 text-on-surface font-body-base text-body-base focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm bg-surface-container-lowest" id="password" name="password" placeholder="••••••••" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Example Error Message -->
<p class="mt-1 font-body-sm text-body-sm text-error flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="error">error</span> Invalid credentials. Please try again.
                    </p>
</div>
<!-- Actions -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded-DEFAULT border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit -->
<div class="pt-unit-4">
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-caps text-label-caps uppercase text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        Sign In
                    </button>
</div>
</form>
</div>
<!-- Footer Info -->
<div class="bg-surface-alt px-unit-6 py-unit-3 border-t border-border-subtle text-center">
<p class="font-body-sm text-body-sm text-outline">System Version 4.2.1 • Authorized Personnel Only</p>
</div>
</div>
</body></html>
